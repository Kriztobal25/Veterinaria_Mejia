<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | VetMejía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
        }
        .main-content { 
            margin-left: 260px; /* Deja espacio para el menú lateral */
            padding-top: 2rem;
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments/sidebar :: menuLateral}"></div>

    <div class="main-content">
        <main class="content p-4">
            
            <style>
                .stat-card {
                    border: none;
                    border-radius: 15px;
                    transition: transform 0.2s ease, box-shadow 0.2s ease;
                    box-shadow: 0 4px 6px rgba(0,0,0,0.03);
                    background: white;
                }
                .stat-card:hover {
                    transform: translateY(-5px);
                    box-shadow: 0 8px 15px rgba(0,0,0,0.08);
                }
                .btn-acceso {
                    border-radius: 15px;
                    padding: 2rem 1rem;
                    transition: all 0.3s ease;
                }
                .btn-acceso:hover {
                    transform: translateY(-4px);
                    filter: brightness(1.05);
                }
                .icon-xl {
                    font-size: 3.5rem;
                    margin-bottom: 1rem;
                }
            </style>

            <div class="mb-4">
                <h2 class="fw-bold text-dark">Bienvenido al Sistema</h2>
                <p class="text-muted">Resumen de operaciones del día.</p>
            </div>

            <div class="row g-4 mb-5">
                
                <div class="col-md-6">
                    <div class="card stat-card h-100 p-4 border-start border-primary border-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 text-primary rounded p-3 me-4">
                                <i class="bi bi-bag-check fs-1"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0" th:text="${cantidadVentas ?: '0'}">0</h3>
                                <p class="text-muted mb-0 fw-medium">Ventas realizadas hoy</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card stat-card h-100 p-4 border-start border-success border-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-success bg-opacity-10 text-success rounded p-3 me-4">
                                <i class="bi bi-cash-stack fs-1"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">S/ <span th:text="${gananciaNeta != null ? #numbers.formatDecimal(gananciaNeta, 1, 'COMMA', 2, 'POINT') : '0.00'}">0.00</span></h3>
                                <p class="text-muted mb-0 fw-medium">Ganancia Neta (Ingresos - Inversión)</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <h4 class="fw-bold text-dark mb-3"><i class="bi bi-grid-fill text-secondary me-2"></i>Accesos Rápidos</h4>
            
            <div class="row g-4">
                
                <div class="col-md-4">
                    <a href="/ventas/nuevo" class="btn btn-primary w-100 btn-acceso shadow-sm text-decoration-none">
                        <i class="bi bi-calculator-fill d-block icon-xl text-white"></i>
                        <h4 class="fw-bold text-white mb-1">Gestión de Caja</h4>
                        <span class="text-white-50">Registrar nueva venta o servicio</span>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="/almacen/productos" class="btn btn-info w-100 btn-acceso shadow-sm text-decoration-none">
                        <i class="bi bi-box-seam-fill d-block icon-xl text-white"></i>
                        <h4 class="fw-bold text-white mb-1">Inventario</h4>
                        <span class="text-white text-opacity-75">Control de stock y catálogo</span>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="/reportes" class="btn btn-success w-100 btn-acceso shadow-sm text-decoration-none">
                        <i class="bi bi-bar-chart-line-fill d-block icon-xl text-white"></i>
                        <h4 class="fw-bold text-white mb-1">Reportes</h4>
                        <span class="text-white-50">Análisis financiero y gráficos</span>
                    </a>
                </div>

            </div>
            
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
