<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ticket de Venta</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; width: 72mm; font-size: 12px; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-left { text-align: left; }
        .bold { font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin: 5px 0; }
        td { padding: 3px 0; }
        .total-final { border-top: 1px dashed #000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="text-center">
        <h2>VETERINARIA MEJÍA</h2>
        <p>RUC: 10453829101</p>
    </div>

    <div>
        <p class="bold" th:text="${venta.tipoComprobante} + ' ELECTRÓNICA'"></p>
        <p>Nº: <span th:text="${venta.serie} + '-' + ${venta.correlativo}"></span></p>
        <p>FECHA: <span th:text="${#temporals.format(venta.fechaEmision, 'dd/MM/yyyy HH:mm')}"></span></p>
        <p>CAJERO ID: <span th:text="${venta.usuarioId}"></span></p>
    </div>

    <div>--------------------------------</div>

    <table>
        <thead>
            <tr>
                <th class="text-left">DESC.</th>
                <th class="text-center">CANT.</th>
                <th class="text-right">TOTAL</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="det : ${venta.detallesVentas}">
                <td class="text-left">
                    <span th:if="${det.producto != null}" th:text="${det.producto.nombre}"></span>
                    <span th:if="${det.servicio != null}" th:text="${det.servicio.nombreServicio}"></span>
                </td>
                <td class="text-center" th:text="${det.cantidad}"></td>
                <td class="text-right" th:text="${#numbers.formatDecimal(det.subtotal, 1, 2)}"></td>
            </tr>
        </tbody>
    </table>

    <div class="total-final">
        <p>TOTAL A PAGAR: S/ <span th:text="${#numbers.formatDecimal(venta.totalVenta, 1, 2)}"></span></p>
    </div>

    <div class="text-center">
        <p>*** GRACIAS POR SU PREFERENCIA ***</p>
    </div>

    <script>
        window.onload = function() {
            window.print();
            setTimeout(function() { window.location.href = "/ventas/nuevo"; }, 1500);
        }
    </script>
</body>
</html>
