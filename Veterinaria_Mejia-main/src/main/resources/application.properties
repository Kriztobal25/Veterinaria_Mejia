# ========================================================
# 1. CONFIGURACIÓN DE CONEXIÓN A MYSQL (ENTORNO LOCAL)
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_mejia_final?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# 2. CONFIGURACIÓN DE JPA / HIBERNATE
# ========================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================================
# 3. CONFIGURACIÓN ADICIONAL DE SPRING
# ========================================================
spring.thymeleaf.cache=false

# ========================================================
# 4. CONFIGURACIÓN DE SUBIDA DE ARCHIVOS (FOTOS)
# ========================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ========================================================
# 5. RUTA DE ALMACENAMIENTO DE FOTOS DE PACIENTES
# ========================================================
# Ruta absoluta fuera del proyecto (más seguro y profesional)
# Se creará automáticamente en tu carpeta de usuario
app.upload.pacientes-dir=${user.home}/vetmejia-uploads/pacientes/

# ========================================================
# 6. MAPEO DE RECURSOS ESTÁTICOS (para servir las fotos)
# ========================================================
# Permite que Spring Boot sirva archivos desde la carpeta externa
spring.web.resources.static-locations=file:${user.home}/vetmejia-uploads/,classpath:/static/