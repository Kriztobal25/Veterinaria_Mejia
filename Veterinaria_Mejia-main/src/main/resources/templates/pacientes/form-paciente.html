<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Registrar Paciente')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: menuLateral}"></div>
<div class="main-content">
    <header th:replace="~{fragments/navbar :: topbar}"></header>
    <main class="content">

        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/pacientes}" class="btn btn-outline-secondary me-3 shadow-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h2 class="mb-1 fw-bold text-dark"><i class="bi bi-paw-fill text-primary me-2"></i>Registrar Nuevo Paciente</h2>
                <p class="text-muted mb-0">Crea la ficha clínica completa de la mascota.</p>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-9">
                <div class="card border-0 shadow-sm" style="border-radius: 15px;">
                    <div class="card-body p-4 p-md-5">
                        <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="POST" enctype="multipart/form-data">

                            <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">
                                <i class="bi bi-1-circle-fill text-primary me-2"></i>Identificación del Paciente
                            </h5>
                            <div class="row g-4 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-dark">Nombre de la Mascota <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Firulais, Luna, Michi" required autofocus>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-dark">Especie <span class="text-danger">*</span></label>
                                    <select class="form-select" th:field="*{especie.id}" required>
                                        <option value="">-- Seleccione Especie --</option>
                                        <option th:each="e : ${especies}" th:value="${e.id}" th:text="${e.nombreEspecie}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-dark">Raza</label>
                                    <input type="text" class="form-control" th:field="*{raza}" placeholder="Ej: Labrador, Siamés, Mestizo">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-dark">Color del Pelaje</label>
                                    <input type="text" class="form-control" th:field="*{colorPelaje}" placeholder="Ej: Dorado, Blanco y negro">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-dark">Sexo <span class="text-danger">*</span></label>
                                    <select class="form-select" th:field="*{sexo}" required>
                                        <option value="">-- Seleccione --</option>
                                        <option value="Macho">Macho</option>
                                        <option value="Hembra">Hembra</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-dark">Fecha de Nacimiento</label>
                                    <input type="date" class="form-control" th:field="*{fechaNacimiento}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-dark">Peso Histórico (kg)</label>
                                    <input type="number" step="0.01" min="0" class="form-control" th:field="*{pesoHistorico}" placeholder="Ej: 12.5">
                                </div>
                            </div>

                            <h5 class="fw-bold text-dark mb-3 border-bottom pb-2 mt-5">
                                <i class="bi bi-2-circle-fill text-primary me-2"></i>Información Médica y de Seguridad
                            </h5>
                            <div class="row g-4 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-dark">N° de Microchip</label>
                                    <input type="text" class="form-control" th:field="*{microchip}" placeholder="Código único (opcional)">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-dark">Tipo de Sangre</label>
                                    <input type="text" class="form-control" th:field="*{sangre}" placeholder="Ej: DEA 1.1, A">
                                </div>
                                <div class="col-md-4 d-flex align-items-end">
                                    <div class="form-check form-switch mb-2">
                                        <input class="form-check-input" type="checkbox" th:field="*{esterilizado}" id="esterilizadoSwitch">
                                        <label class="form-check-label fw-bold" for="esterilizadoSwitch">Paciente Esterilizado</label>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-dark">
                                        <i class="bi bi-exclamation-triangle-fill text-danger me-1"></i>Alergias Conocidas
                                    </label>
                                    <textarea class="form-control" th:field="*{alergias}" rows="2" placeholder="Ej: Penicilina, pollo, ácaros..."></textarea>
                                    <div class="form-text text-danger">⚠️ Información crítica para el tratamiento.</div>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-dark">Observaciones Generales</label>
                                    <textarea class="form-control" th:field="*{observaciones}" rows="2" placeholder="Notas adicionales sobre el comportamiento, condiciones crónicas, etc."></textarea>
                                </div>
                            </div>

                            <h5 class="fw-bold text-dark mb-3 border-bottom pb-2 mt-5">
                                <i class="bi bi-3-circle-fill text-primary me-2"></i>Dueño / Tutor Responsable
                            </h5>
                            <div class="row g-4 mb-4">
                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-dark">Seleccionar Cliente Registrado <span class="text-danger">*</span></label>
                                    <select class="form-select" th:field="*{cliente.id}" required>
                                        <option value="">-- Seleccione al Tutor --</option>
                                        <option th:each="c : ${clientes}" 
                                                th:value="${c.id}" 
                                                th:text="${c.nombre} + ' - DNI: ' + ${c.dni}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <h5 class="fw-bold text-dark mb-3 border-bottom pb-2 mt-5">
                                <i class="bi bi-4-circle-fill text-primary me-2"></i>Fotografía del Paciente
                            </h5>
                            <div class="row g-4 mb-4">
                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-dark">Subir Foto</label>
                                    <input type="file" class="form-control" name="foto" accept="image/*" id="inputFoto" onchange="previsualizarFoto(event)">
                                    <div class="form-text">Formatos: JPG, PNG. Máximo 5MB.</div>
                                    <div class="mt-3 text-center">
                                        <img id="previewFoto" src="" alt="Previsualización" class="rounded-3 shadow-sm" style="max-width: 250px; display: none; border: 3px solid #e2e8f0;">
                                    </div>
                                </div>
                            </div>

                            <hr class="my-5 text-muted">
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/pacientes}" class="btn btn-light fw-600 px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary fw-600 px-4 shadow-sm">
                                    <i class="bi bi-save me-2"></i>Guardar Paciente
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function previsualizarFoto(event) {
    const input = event.target;
    const preview = document.getElementById('previewFoto');
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
</body>
</html>
