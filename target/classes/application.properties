# ========================================================
# 1. CONFIGURACIÓN DE CONEXIÓN A MYSQL (CON VARIABLES DE ENTORNO)
#    ¡IMPORTANTE! No se deben guardar credenciales sensibles directamente en este archivo
#    en entornos de producción. Usa variables de entorno o un sistema de gestión de secretos.
# ========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veterinaria_mejia_final_prod?createDatabaseIfNotExist=false}
spring.datasource.username=${DB_USERNAME:prod_user}
spring.datasource.password=${DB_PASSWORD:secure_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# 2. CONFIGURACIÓN DE JPA / HIBERNATE
#    Configuración optimizada para producción.
#    Considera usar 'none' en producción si las migraciones de DB se manejan externamente.
#
# ========================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================================
# Resto de tus configuraciones...
# ========================================================
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m